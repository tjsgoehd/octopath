<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>은빛독수리 캐릭보유 아카이브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        
        :root { 
            --bg-dark: #0d0d0c; 
            --card-bg: #1a1a18; 
            --accent: #d97706; 
            --status-color: #ffcc00; 
            --highlight: #99ffff;
            --check-accent: #99ffff; 
            --box-accent: #FF9933;
            --border-line: rgba(255,255,255,0.05);
            --header-bg: #141412;
            --th-bg: #2d2d26;
            --text-main: #e2e2d5;
            --tab-active-bg: rgba(255, 204, 0, 0.05);
            --tab-text: #666;
            --logo-color: #fef3c7;
            --light-col-color: #99FFFF;
        }

        body.light-mode {
            --bg-dark: #f8fafc;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --th-bg: #f8fafc;
            --border-line: #edf2f7;
            --text-main: #334155;
            --accent: #3b82f6;
            --status-color: #2563eb;
            --tab-active-bg: #eff6ff;
            --tab-text: #64748b;
            --logo-color: #1e3a8a;
            --light-col-color: #2563eb;
        }
        
        body { 
            font-family: 'Inter', 'Noto Sans KR', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            overflow: hidden; 
            height: 100vh;    
            display: flex;
            flex-direction: column;
            transition: background-color 0.2s ease;
            -webkit-text-size-adjust: none;
        }
        
        header { 
            background: var(--header-bg); 
            border-bottom: 1px solid var(--border-line); 
            flex-shrink: 0; 
            z-index: 50;
        }
        
        main { flex: 1; overflow: hidden; position: relative; width: 100%; }

        .table-container { 
            height: 100%; width: 100%; overflow: auto; background: var(--bg-dark);
            -webkit-overflow-scrolling: touch;
        }

        /* 스크롤바 최적화 */
        .table-container::-webkit-scrollbar { height: 6px; width: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.2); border-radius: 10px; }

        table { width: max-content; border-spacing: 0; border-collapse: separate; table-layout: fixed; }

        th { 
            background: var(--th-bg) !important; 
            color: var(--tab-text) !important; 
            font-size: 11px; font-weight: 800;
            padding: 10px 12px; 
            border-right: 1px solid var(--border-line);
            border-bottom: 1px solid var(--border-line);
            position: sticky; top: 0; z-index: 40; 
            white-space: nowrap; text-align: center;
        }

        td { 
            font-size: 12px; padding: 0 !important; height: 50px; text-align: center; vertical-align: middle;
            background: var(--card-bg); border-bottom: 1px solid var(--border-line); border-right: 1px solid var(--border-line);
            color: var(--text-main);
        }

        /* 모달 디자인 최적화 */
        .modal-content {
            width: 90%; max-width: 400px; padding: 2rem; border-radius: 1.5rem;
        }

        /* 고정 컬럼 기본 너비 (모바일에서 재조정됨) */
        .sticky-col-drag { position: sticky; left: 0; z-index: 30 !important; width: 40px; background: var(--card-bg) !important; }
        .sticky-col-job { position: sticky; z-index: 25; width: 50px; background: var(--card-bg) !important; }
        .sticky-col-type { position: sticky; z-index: 25; width: 60px; background: var(--card-bg) !important; }
        .sticky-col-name { position: sticky; z-index: 25; width: 80px; background: var(--card-bg) !important; border-right: 2px solid var(--border-line); }
        
        thead th.sticky-col-drag, thead th.sticky-col-job, thead th.sticky-col-type, thead th.sticky-col-name { 
            z-index: 50 !important; background: var(--th-bg) !important; 
        }

        /* 탭 버튼 모바일 최적화 */
        .tab-btn {
            padding: 10px 15px; font-size: 11px; font-weight: 900; color: var(--tab-text);
            border-bottom: 2px solid transparent; transition: all 0.2s ease; cursor: pointer;
            white-space: nowrap; flex: 1; text-align: center;
        }
        .tab-btn.active { color: var(--status-color); border-bottom-color: var(--status-color); background: var(--tab-active-bg); }

        /* 텍스트 입력 영역 */
        .cell-textarea { 
            width: 100% !important; min-height: 50px !important; background: transparent !important; border: none !important; color: inherit; 
            text-align: left; outline: none !important; padding: 8px 10px !important; resize: none; overflow: hidden; line-height: 1.4; 
            white-space: pre-wrap; box-sizing: border-box !important; field-sizing: content; font-size: 11px;
        }

        .cell-input { 
            background: transparent !important; border: 0 !important; color: inherit; text-align: center; outline: none !important; padding: 0 !important; 
            width: 100% !important; height: 100% !important; box-sizing: border-box !important; font-size: 11px;
        }

        .display-multiline, .display-center, .display-left { 
            display: flex; align-items: center; padding: 8px 10px !important; white-space: pre-wrap; line-height: 1.4; word-break: keep-all; min-height: 50px; box-sizing: border-box; font-size: 11px;
        }
        .display-center { justify-content: center; text-align: center; }
        .display-left { justify-content: flex-start; text-align: left; }

        .preview-img { max-height: 35px; max-width: 100%; object-fit: contain; }

        .badge-box {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 2px 5px; border-radius: 3px; font-size: 9px; font-weight: 900;
            background: rgba(128,128,128,0.1); color: #94a3b8;     
        }
        .badge-box.active { background: #dcfce7 !important; color: #166534 !important; }
        body:not(.light-mode) .badge-box.active { background: var(--highlight) !important; color: #000 !important; }

        .check-circle-icon {
            width: 16px; height: 16px; background-color: #22c55e; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; font-size: 8px;
        }

        /* 필터 및 검색 모바일 최적화 */
        .filter-select {
            background: var(--card-bg); border: 1px solid var(--border-line); border-radius: 6px; color: var(--tab-text); 
            font-size: 10px; font-weight: 700; padding: 4px 8px; outline: none;
        }

        .search-input {
            background: rgba(128,128,128,0.05); border: 1px solid var(--border-line); border-radius: 15px; 
            padding: 4px 12px; font-size: 10px; color: var(--text-main); outline: none; width: 100%;
        }

        /* 테마 스위치 크기 축소 */
        .theme-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e2e8f0; transition: .3s; border-radius: 24px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 6px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%; z-index: 2;
        }
        input:checked + .slider:before { transform: translateX(20px); }
        .slider i { font-size: 10px; color: #94a3b8; }

        /* 모바일 대응 미디어 쿼리 (768px 이하) */
        @media (max-width: 768px) {
            header .px-6 { padding-left: 1rem; padding-right: 1rem; padding-top: 0.75rem; padding-bottom: 0.75rem; }
            header h1 { font-size: 1rem; }
            header p { font-size: 7px; }
            
            .tab-btn { padding: 8px 5px; font-size: 10px; }
            
            /* 고정 컬럼 너비 강제 조정 */
            .sticky-col-job { width: 40px; }
            .sticky-col-type { width: 50px; }
            .sticky-col-name { width: 70px; }
            
            .search-input { width: 120px; }
            #userInfo { display: none; }
            #adminBtn, #logoutBtn, #addCharBtn { padding: 6px 10px; font-size: 10px; }
        }

        .negative-value { color: #ef4444; font-weight: 700; }
    </style>
</head>
<body class="light-mode">

    <div id="loading" class="loading-overlay fixed inset-0 z-[9999] bg-black flex items-center justify-center">
        <div class="flex flex-col items-center gap-4">
            <div class="w-10 h-10 border-4 border-blue-500/20 border-t-blue-500 rounded-full animate-spin"></div>
            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Loading...</p>
        </div>
    </div>

    <header>
        <!-- 상단: 로고 및 테마/로그인 -->
        <div class="px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="p-1.5 bg-blue-500/10 rounded-lg"><i class="fa-solid fa-feather-pointed text-blue-600 text-base"></i></div>
                <div>
                    <h1 class="text-base font-black tracking-tight italic uppercase" style="color: var(--logo-color)">은빛독수리 아카이브</h1>
                    <p class="text-[7px] font-bold uppercase tracking-[0.2em] opacity-60">SILVER EAGLE ARCHIVE</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="theme-switch-wrapper">
                    <label class="theme-switch">
                        <input type="checkbox" id="themeCheckbox">
                        <span class="slider">
                            <i class="fa-solid fa-sun"></i>
                            <i class="fa-solid fa-moon"></i>
                        </span>
                    </label>
                </div>
                <button id="addCharBtn" class="hidden px-3 py-1.5 bg-blue-600 text-white rounded-lg text-[10px] font-black hover:bg-blue-700 transition-all">
                    <i class="fa-solid fa-plus"></i> 추가
                </button>
                <button id="adminBtn" class="px-3 py-1.5 rounded-lg text-[10px] font-bold border border-slate-200 text-slate-500">ADMIN</button>
                <button id="logoutBtn" class="hidden px-3 py-1.5 rounded-lg text-[10px] font-bold border border-red-200 text-red-500">OUT</button>
            </div>
        </div>
        
        <!-- 하단: 탭 및 검색 -->
        <div class="flex flex-col border-t border-slate-100">
            <div class="flex w-full overflow-x-auto no-scrollbar">
                <button id="tab-5star" class="tab-btn active" onclick="window.switchTab('5star')">5성 (...)</button>
                <button id="tab-lowstar" class="tab-btn" onclick="window.switchTab('lowstar')">4성/3성 (...)</button>
                <button id="tab-beast" class="tab-btn" onclick="window.switchTab('beast')">지염수 (...)</button>
            </div>
            <div class="flex items-center gap-2 px-3 py-2 bg-slate-50/50">
                <select id="searchFieldFilter" class="filter-select shrink-0">
                    <option value="all">전체</option>
                    <option value="basestat">악세(스탯)</option>
                    <option value="extra1">악세(효과)</option>
                    <option value="extra2">서포트</option>
                </select>
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-[9px]"></i>
                    <input type="text" id="charSearch" placeholder="검색..." class="search-input pl-8">
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="tableScroll" class="table-container">
            <table id="mainTable">
                <colgroup id="tableColGroup"></colgroup>
                <thead><tr id="headerRow"></tr></thead>
                <tbody id="travelerTableBody"></tbody>
            </table>
        </div>
    </main>

    <!-- 모달: 관리자 로그인 -->
    <div id="loginModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-xs text-center shadow-2xl">
            <h2 class="text-sm font-black text-slate-800 mb-4 uppercase">Admin Verify</h2>
            <input type="password" id="loginPassword" placeholder="Password" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 text-center outline-none mb-4 text-sm">
            <button id="doLogin" class="w-full py-3 bg-blue-600 text-white font-black rounded-xl text-sm">인증</button>
            <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="mt-4 text-[10px] text-slate-400 font-bold uppercase underline">취소</button>
        </div>
    </div>

    <!-- 모달: 삭제 확인 -->
    <div id="deleteConfirmModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-xs text-center">
            <h2 class="text-sm font-black text-slate-800 mb-2">삭제하시겠습니까?</h2>
            <div class="flex gap-2 mt-6">
                <button id="cancelDeleteBtn" class="flex-1 py-3 bg-slate-100 text-slate-500 font-bold rounded-xl text-xs">취소</button>
                <button id="confirmDeleteBtn" class="flex-1 py-3 bg-red-600 text-white font-black rounded-xl text-xs">삭제</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjbApqAPhrZXcnR2P_xd-nvrZOvZp67CI",
            authDomain: "octopath-85851.firebaseapp.com",
            projectId: "octopath-85851",
            storageBucket: "octopath-85851.firebasestorage.app",
            messagingSenderId: "744016190979",
            appId: "1:744016190979:web:fbc5badeda2e24f5f47836"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'silver-eagle-archive';
        const ADMIN_EMAIL = "tjsgoehd@gmail.com";

        const travelerTableBody = document.getElementById('travelerTableBody');
        const adminBtn = document.getElementById('adminBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const addCharBtn = document.getElementById('addCharBtn');
        const loadingOverlay = document.getElementById('loading');
        const charSearch = document.getElementById('charSearch');
        const searchFieldFilter = document.getElementById('searchFieldFilter');
        const loginPasswordInput = document.getElementById('loginPassword');
        const doLoginBtn = document.getElementById('doLogin');
        const deleteConfirmModal = document.getElementById('deleteConfirmModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const headerRow = document.getElementById('headerRow');
        const tableColGroup = document.getElementById('tableColGroup');
        const themeCheckbox = document.getElementById('themeCheckbox');

        let currentUser = null;
        let activeTab = '5star';
        let rawData = [];
        let unsubscribeCurrent = null;
        let deleteIdPending = null;

        const COLLECTION_MAP = { '5star': 'travelers', 'lowstar': 'travelers_lowstar', 'beast': 'travelers_beast' };

        // 테마 및 토글 로직
        themeCheckbox.onchange = () => {
            const isDark = themeCheckbox.checked;
            document.body.classList.toggle('light-mode', !isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateStickyPositions();
            renderTable();
        };

        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            themeCheckbox.checked = false;
        } else {
            document.body.classList.remove('light-mode');
            themeCheckbox.checked = true;
        }

        function updateStickyPositions() {
            const isAdmin = currentUser && !currentUser.isAnonymous;
            const dragH = document.getElementById('dragHeader');
            const jobH = document.getElementById('th-job');
            const typeH = document.getElementById('th-type');
            const nameH = document.getElementById('th-name');
            if (!jobH || !typeH || !nameH) return;
            
            const isMobile = window.innerWidth <= 768;
            let currentLeft = 0;
            if (isAdmin && dragH) { dragH.style.left = currentLeft + 'px'; currentLeft += (isMobile ? 40 : 44); }
            jobH.style.left = currentLeft + 'px'; currentLeft += (isMobile ? 40 : 50);
            typeH.style.left = currentLeft + 'px'; currentLeft += (isMobile ? 50 : 60);
            nameH.style.left = currentLeft + 'px';
        }

        window.deleteRow = (id) => { deleteIdPending = id; deleteConfirmModal.classList.remove('hidden'); };
        confirmDeleteBtn.onclick = async () => {
            if (deleteIdPending) {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], deleteIdPending)); deleteIdPending = null; deleteConfirmModal.classList.add('hidden'); } 
                catch (e) { console.error(e); }
            }
        };
        cancelDeleteBtn.onclick = () => { deleteIdPending = null; deleteConfirmModal.classList.add('hidden'); };

        window.switchTab = (tab) => {
            activeTab = tab;
            if (charSearch) charSearch.value = '';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${tab}`));
            renderHeader();
            loadTable();
        };

        function renderHeader() {
            const isAdmin = currentUser && !currentUser.isAnonymous;
            const isMobile = window.innerWidth <= 768;
            let hHtml = ''; let cHtml = '';
            
            if (isAdmin) { 
                hHtml += `<th id="dragHeader" class="sticky-col-drag">↕</th>`; 
                cHtml += `<col style="width: ${isMobile ? 40 : 44}px;">`; 
            }
            
            hHtml += `<th id="th-job" class="sticky-col-job">직업</th>
                      <th id="th-type" class="sticky-col-type">캐릭터</th>
                      <th id="th-name" class="sticky-col-name">이름</th>`;
            
            cHtml += `<col style="width: ${isMobile ? 40 : 50}px;">
                      <col style="width: ${isMobile ? 50 : 60}px;">
                      <col style="width: ${isMobile ? 70 : 80}px;">`;
            
            if (activeTab === 'beast') {
                hHtml += '<th>BP소모</th><th>준비/재사용</th><th>스킬명</th><th>스킬내용</th><th>습득방법</th>';
                cHtml += '<col style="width: 70px;"><col style="width: 120px;"><col style="width: 150px;"><col style="width: 350px;"><col style="width: 250px;">';
            } else {
                hHtml += '<th>성장</th><th>등화</th><th>등화(배/서)</th><th>등화(스탯)</th><th>LV</th><th>천부</th><th>필살기</th><th>각성</th><th>오의</th><th>등불</th><th>악세명</th><th>악세(스탯)</th><th>악세(효과)</th><th>서포트</th><th>필살기 정보</th><th>EX 어빌</th>';
                cHtml += '<col style="width: 70px;"><col style="width: 50px;"><col style="width: 90px;"><col style="width: 70px;"><col style="width: 50px;"><col style="width: 50px;"><col style="width: 60px;"><col style="width: 45px;"><col style="width: 45px;"><col style="width: 60px;"><col style="width: 140px;"><col style="width: 180px;"><col style="width: 380px;"><col style="width: 450px;"><col style="width: 380px;"><col style="width: 380px;">';
            }
            
            if (isAdmin) { hHtml += '<th class="bg-red-50 text-red-500">삭제</th>'; cHtml += '<col style="width: 50px;">'; }
            headerRow.innerHTML = hHtml;
            tableColGroup.innerHTML = cHtml;
        }

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const isAdmin = user && !user.isAnonymous;
            adminBtn.classList.toggle('hidden', isAdmin);
            logoutBtn.classList.toggle('hidden', !isAdmin);
            addCharBtn.classList.toggle('hidden', !isAdmin);
            if (!user) await signInAnonymously(auth);
            renderHeader();
            loadTable();
            updateAllCounts();
            loadingOverlay.style.display = 'none';
        });

        function updateAllCounts() {
            ['5star', 'lowstar', 'beast'].forEach(t => {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[t]), (snap) => {
                    let gifts = 0; snap.forEach(d => { if (d.data().gift?.trim()) gifts++; });
                    const btn = document.getElementById(`tab-${t}`);
                    if (btn) btn.innerText = `${t === '5star' ? '5성' : (t === 'lowstar' ? '4성/3성' : '지염수')} (${gifts}/${snap.size})`;
                });
            });
        }

        function loadTable() {
            if (unsubscribeCurrent) unsubscribeCurrent();
            unsubscribeCurrent = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab]), (snap) => {
                rawData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                rawData.sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));
                renderTable();
                setTimeout(updateStickyPositions, 100);
            });
        }

        function renderTable() {
            const searchTerm = (charSearch.value || "").toLowerCase().trim();
            const filterField = searchFieldFilter.value;
            travelerTableBody.innerHTML = '';
            rawData.filter(i => {
                if (!searchTerm) return true;
                if (filterField === 'all') return Object.values(i).join(' ').toLowerCase().includes(searchTerm);
                return (i[filterField] || '').toString().toLowerCase().includes(searchTerm);
            }).forEach(i => renderRow(i));
        }

        charSearch.oninput = renderTable;
        searchFieldFilter.onchange = renderTable;

        function renderRow(data) {
            const isAdmin = currentUser && !currentUser.isAnonymous;
            const isMobile = window.innerWidth <= 768;
            const tr = document.createElement('tr');
            tr.setAttribute('data-id', data.id);
            
            let currentOffset = 0;
            if (isAdmin) {
                const dTd = document.createElement('td');
                dTd.className = "drag-handle-cell sticky-col-drag"; dTd.style.left = '0px';
                dTd.innerHTML = '<div class="drag-handle-inner"><i class="fa-solid fa-grip-vertical"></i></div>';
                tr.appendChild(dTd); currentOffset += (isMobile ? 40 : 44); 
            }

            let fields = (activeTab === 'beast') ? ['job', 'type', 'name', 'extra2', 'accessory', 'basestat', 'extra1', 'extra3'] 
                        : ['job', 'type', 'name', 'status', 'light', 'support', 'reinforce', 'level', 'gift', 'skill', 'awake', 'ultimate', 'crystal', 'accessory', 'basestat', 'extra1', 'extra2', 'extra3', 'extra4'];
            
            fields.forEach(field => {
                const td = document.createElement('td');
                if (field === 'job') { td.classList.add('sticky-col-job'); td.style.left = currentOffset + 'px'; }
                if (field === 'type') { td.classList.add('sticky-col-type'); td.style.left = (currentOffset + (isMobile ? 40 : 50)) + 'px'; }
                if (field === 'name') { td.classList.add('sticky-col-name'); td.style.left = (currentOffset + (isMobile ? 90 : 110)) + 'px'; }

                if (isAdmin) {
                    if ((field === 'type' || field === 'gift') || (field === 'job' && activeTab !== 'beast')) {
                        const w = document.createElement('div'); w.className = "image-cell-wrapper p-1 flex justify-center";
                        if (data[field]) {
                            const img = document.createElement('img'); img.src = data[field]; img.className = "preview-img";
                            img.onclick = () => updateCell(data.id, field, '');
                            w.appendChild(img);
                        } else { w.innerHTML = '<i class="fa-solid fa-image opacity-10 text-[10px]"></i>'; }
                        w.onpaste = (e) => handlePaste(e, (res) => updateCell(data.id, field, res));
                        td.appendChild(w);
                    } else if (['extra1', 'extra2', 'extra3', 'extra4'].includes(field)) {
                        const ta = document.createElement('textarea'); ta.className = "cell-textarea"; ta.value = data[field] || '';
                        ta.onblur = () => { if (ta.value !== (data[field] || '')) updateCell(data.id, field, ta.value); };
                        td.appendChild(ta);
                    } else if (field === 'support') {
                        const c = document.createElement('div'); c.className = "flex gap-2 justify-center items-center h-full px-1";
                        const cur = Array.isArray(data[field]) ? data[field] : [];
                        [1, 2].forEach(i => {
                            const rb = document.createElement('input'); rb.type = "checkbox"; rb.className = "round-radio w-4 h-4"; rb.checked = cur.includes(i);
                            rb.onchange = () => updateCell(data.id, field, rb.checked ? [...cur, i] : cur.filter(v => v !== i));
                            c.appendChild(rb);
                        });
                        td.appendChild(c);
                    } else if (['awake', 'ultimate'].includes(field)) {
                        const cb = document.createElement('input'); cb.type = "checkbox"; cb.className = "simple-checkbox w-4 h-4"; cb.checked = !!data[field];
                        cb.onchange = () => updateCell(data.id, field, cb.checked);
                        td.appendChild(cb);
                    } else {
                        const inp = document.createElement('input'); inp.className = "cell-input"; inp.value = data[field] || '';
                        if (field === 'status') { inp.style.color = "var(--status-color)"; inp.style.fontWeight = "900"; }
                        if (field === 'light') { inp.style.color = "var(--light-col-color)"; inp.style.fontWeight = "700"; }
                        inp.onblur = () => { if (inp.value !== (data[field] || '')) updateCell(data.id, field, inp.value); };
                        td.appendChild(inp);
                    }
                } else {
                    if ((field === 'type' || field === 'gift') || (field === 'job' && activeTab !== 'beast')) {
                        td.innerHTML = data[field] ? `<div class="px-1 h-full flex items-center justify-center"><img src="${data[field]}" class="preview-img"></div>` : '-';
                    } else if (field === 'support') {
                        const cur = Array.isArray(data[field]) ? data[field] : [];
                        td.innerHTML = `<div class="flex gap-1 justify-center items-center h-full px-1"><span class="badge-box ${cur.includes(1) ? 'active' : ''}">배</span><span class="badge-box ${cur.includes(2) ? 'active' : ''}">서</span></div>`;
                    } else if (['awake', 'ultimate'].includes(field)) {
                        td.innerHTML = data[field] ? '<div class="px-1 h-full flex items-center justify-center"><div class="check-circle-icon"><i class="fa-solid fa-check"></i></div></div>' : '<span class="opacity-30 text-[10px]">-</span>';
                    } else {
                        const s = document.createElement('span'); 
                        const isLeft = ['accessory', 'basestat', 'extra1', 'extra2', 'extra3', 'extra4'].includes(field);
                        s.className = isLeft ? "display-left" : "display-center";
                        if (field === 'status') s.style.color = "var(--status-color)";
                        if (field === 'light') s.style.color = "var(--light-col-color)";
                        if (field === 'basestat' && data[field]) {
                            s.innerHTML = data[field].toString().replace(/-\d+/g, (m) => `<span class="negative-value">${m}</span>`);
                        } else { s.innerText = data[field] || '-'; }
                        td.appendChild(s);
                    }
                }
                tr.appendChild(td);
            });

            if (isAdmin) {
                const delTd = document.createElement('td');
                delTd.innerHTML = `<div class="text-slate-300 hover:text-red-500 cursor-pointer" onclick="window.deleteRow('${data.id}')"><i class="fa-solid fa-trash-can"></i></div>`;
                tr.appendChild(delTd);
            }
            travelerTableBody.appendChild(tr);
        }

        async function updateCell(id, f, v) { try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], id), { [f]: v }); } catch(e) { console.error(e); } }

        function handlePaste(e, cb) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) {
                if (item.type.indexOf("image") !== -1) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image(); img.src = ev.target.result;
                        img.onload = () => {
                            const cv = document.createElement('canvas'); const maxW = 100; const sc = maxW / img.width;
                            cv.width = maxW; cv.height = img.height * sc;
                            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                            cb(cv.toDataURL('image/webp', 0.8));
                        };
                    };
                    reader.readAsDataURL(item.getAsFile());
                }
            }
        }

        addCharBtn.onclick = async () => {
            const col = collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab]);
            const snap = await getDocs(col);
            let maxO = snap.docs.reduce((max, d) => Math.max(max, d.data().order ?? -1), -1);
            let newObj = { name: '새 데이터', order: maxO + 1, job: '', type: '', accessory: '', basestat: '', extra1: '', extra2: '', extra3: '' };
            if (activeTab !== 'beast') Object.assign(newObj, { status: activeTab === '5star' ? '5성' : '4성', light: '', level: '', skill: '', crystal: '', support: [] });
            await addDoc(col, newObj);
        };

        const executeLogin = async () => { try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, loginPasswordInput.value); document.getElementById('loginModal').classList.add('hidden'); } catch(e) { alert('인증 실패'); } };
        adminBtn.onclick = () => { document.getElementById('loginModal').classList.remove('hidden'); loginPasswordInput.focus(); };
        doLoginBtn.onclick = executeLogin;
        loginPasswordInput.onkeydown = (e) => { if (e.key === 'Enter') executeLogin(); };
        logoutBtn.onclick = async () => { await signOut(auth); location.reload(); };

        Sortable.create(travelerTableBody, {
            animation: 150, handle: '.drag-handle-cell',
            onEnd: async () => {
                const batch = writeBatch(db);
                Array.from(travelerTableBody.querySelectorAll('tr')).forEach((row, idx) => { batch.update(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], row.getAttribute('data-id')), { order: idx }); });
                await batch.commit();
            }
        });
        window.addEventListener('resize', () => { renderHeader(); updateStickyPositions(); });
    </script>
</body>
</html>
