<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>은빛독수리 캐릭보유 아카이브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap');
        
        :root { 
            --bg-dark: #1a1c1e; 
            --card-bg: #212427; 
            --header-bg: #1a1c1e;
            --th-bg: #282c31;
            --border-line: rgba(255, 255, 255, 0.05);
            --text-main: #e0e0e0;
            --text-muted: #9ba1a6;
            --accent: #00d4ff; 
            --status-color: #70e0ff; 
            --highlight: #00d4ff;
            --tab-active-bg: rgba(0, 212, 255, 0.1);
            --tab-text: #80868b;
            --logo-color: #ffffff;
            --light-col-color: #00d4ff;
        }

        body.light-mode {
            --bg-dark: #f0f2f5;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --th-bg: #f8f9fa;
            --border-line: #e9ecef;
            --text-main: #212529;
            --text-muted: #6c757d;
            --accent: #007bff;
            --status-color: #0056b3;
            --tab-active-bg: #eef2ff;
            --tab-text: #adb5bd;
            --logo-color: #0f172a;
            --light-col-color: #0284c7;
        }
        
        body { 
            font-family: 'Inter', 'Noto Sans KR', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            margin: 0; 
            overflow: hidden; 
            height: 100vh;    
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }
        
        header { 
            background: var(--header-bg); 
            border-bottom: 1px solid var(--border-line); 
            flex-shrink: 0; 
            z-index: 50;
        }
        
        main { flex: 1; overflow: hidden; position: relative; width: 100%; }

        .table-container { 
            height: 100%; width: 100%; overflow: auto; background: var(--bg-dark);
        }

        .table-container::-webkit-scrollbar { height: 6px; width: 4px; }
        .table-container::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.1); border-radius: 10px; }

        table { width: max-content; border-spacing: 0; border-collapse: separate; table-layout: auto; }

        th { 
            background: var(--th-bg) !important; 
            color: var(--text-muted) !important; 
            font-size: 11px; font-weight: 700;
            padding: 12px 14px; 
            border-bottom: 1px solid var(--border-line);
            position: sticky; top: 0; z-index: 40; 
            white-space: nowrap; text-align: center;
        }

        td { 
            font-size: 12px; padding: 0 !important; min-height: 56px; text-align: center; vertical-align: middle;
            background: var(--card-bg); border-bottom: 1px solid var(--border-line);
            color: var(--text-main);
        }

        .sticky-col-drag, .sticky-col-job, .sticky-col-type, .sticky-col-name {
            position: sticky;
            z-index: 20;
            border-right: 1px solid var(--border-line) !important;
        }
        
        th.sticky-col-drag, th.sticky-col-job, th.sticky-col-type, th.sticky-col-name {
            background: var(--th-bg) !important;
            z-index: 45; 
        }

        td.sticky-col-drag, td.sticky-col-job, td.sticky-col-type, td.sticky-col-name {
            background: var(--card-bg) !important;
        }

        .tab-btn {
            padding: 16px 20px; font-size: 12px; font-weight: 700; color: var(--tab-text);
            transition: all 0.2s ease; cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab-btn.active { 
            color: var(--accent); 
            border-bottom-color: var(--accent);
            background: var(--tab-active-bg);
        }

        /* [수정] 데이터 셀 내부 텍스트 수직 중앙 정렬 강화 */
        .cell-textarea { 
            width: 100%; 
            min-height: 56px; 
            background: transparent; 
            border: none; 
            color: inherit; 
            padding: 12px 14px; 
            resize: none; 
            overflow: hidden; 
            font-size: 11px; 
            line-height: 1.5;
            white-space: pre-wrap; 
            word-break: break-all;
            display: grid; 
            align-content: center; /* Grid 기반 수직 중앙 정렬 */
        }

        .cell-input { 
            background: transparent; border: 0; color: inherit; text-align: center; 
            width: 100%; height: 56px; font-size: 11px; font-weight: 600;
            padding: 0 10px; display: block;
        }

        /* [수정] 보기 모드에서도 수직 중앙 정렬 보장 */
        .display-left, .display-center { 
            display: grid; 
            align-content: center; /* 수직 중앙 정렬 핵심 */
            padding: 12px 14px; 
            font-size: 11px; 
            min-height: 56px; 
            height: 100%;
            width: 100%;
            white-space: pre-wrap; 
            word-break: break-all;
            box-sizing: border-box;
        }
        .display-left { text-align: left; justify-content: start; }
        .display-center { text-align: center; justify-content: center; }

        .preview-img { max-height: 40px; border-radius: 4px; object-fit: contain; }
        .preview-img-large { max-height: 50px !important; width: auto; border-radius: 4px; object-fit: contain; display: block; }

        .badge-box {
            padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800;
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted);
        }
        .badge-box.active { background: var(--accent) !important; color: #212427 !important; }

        .check-circle-icon {
            width: 18px; height: 18px; background-color: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: #000; font-size: 9px;
        }

        .filter-select {
            background: var(--th-bg); border: 1px solid var(--border-line); border-radius: 8px; color: var(--text-main); 
            font-size: 11px; padding: 6px 12px;
        }

        .search-input {
            background: var(--th-bg); border: 1px solid var(--border-line); border-radius: 20px; 
            padding: 8px 16px; font-size: 12px; color: var(--text-main); width: 100%;
        }

        .theme-switch { position: relative; display: inline-block; width: 52px; height: 28px; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #282c31; transition: .3s; border-radius: 34px;
            display: flex; align-items: center; justify-content: space-between; padding: 0 8px;
            border: 1px solid var(--border-line);
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%; z-index: 2;
        }
        input:checked + .slider:before { transform: translateX(24px); }
        .slider i { font-size: 12px; color: var(--accent); }

        .negative-value { color: #ff5252; font-weight: 800; }

        .image-cell-wrapper { width: 100%; height: 56px; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        @media (max-width: 768px) {
            .sticky-col-job { width: auto; min-width: 60px; }
            .sticky-col-name { width: auto; min-width: 90px; }
        }
    </style>
</head>
<body class="light-mode">

    <div id="loading" class="fixed inset-0 z-[9999] bg-[#1a1c1e] flex items-center justify-center">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-cyan-500/20 border-t-cyan-500 rounded-full animate-spin"></div>
            <p class="text-[10px] font-black text-cyan-500 uppercase tracking-widest">Initialising Archive...</p>
        </div>
    </div>

    <header>
        <div class="px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-cyan-500/10 rounded-2xl border border-cyan-500/20">
                    <i class="fa-solid fa-feather-pointed text-cyan-500 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-black tracking-tight italic uppercase" style="color: var(--logo-color)">은빛독수리 아카이브</h1>
                    <p class="text-[8px] font-bold uppercase tracking-[0.3em] text-cyan-500/60">PREMIUM DASHBOARD v2.5</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="theme-switch-wrapper">
                    <label class="theme-switch">
                        <input type="checkbox" id="themeCheckbox" style="display:none;">
                        <span class="slider">
                            <i class="fa-solid fa-sun"></i>
                            <i class="fa-solid fa-moon"></i>
                        </span>
                    </label>
                </div>
                <button id="addCharBtn" class="hidden px-4 py-2 bg-cyan-600 text-white rounded-xl text-xs font-black hover:bg-cyan-700 transition-all shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid fa-plus mr-1"></i> ADD
                </button>
                <button id="adminBtn" class="px-4 py-2 rounded-xl text-xs font-bold border border-white/10 text-slate-400 hover:bg-white/5 transition-all">ADMIN LOGIN</button>
                <button id="logoutBtn" class="hidden px-4 py-2 rounded-xl text-xs font-bold border border-red-500/30 text-red-400 hover:bg-red-500/10">LOGOUT</button>
            </div>
        </div>
        
        <div class="flex flex-col bg-black/5">
            <div class="flex w-full overflow-x-auto no-scrollbar border-t border-white/5">
                <button id="tab-5star" class="tab-btn active" onclick="window.switchTab('5star')">5성 (...)</button>
                <button id="tab-lowstar" class="tab-btn" onclick="window.switchTab('lowstar')">4성/3성 (...)</button>
                <button id="tab-beast" class="tab-btn" onclick="window.switchTab('beast')">지염수 (...)</button>
            </div>
            <div class="flex items-center gap-3 px-6 py-3 border-t border-white/5">
                <select id="searchFieldFilter" class="filter-select">
                    <option value="all">전체 필터</option>
                    <option value="basestat">악세(스탯)</option>
                    <option value="extra1">악세(효과)</option>
                    <option value="extra2">서포트</option>
                </select>
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="charSearch" placeholder="검색어를 입력해 주세요..." class="search-input pl-11">
                </div>
            </div>
        </div>
    </header>

    <main>
        <div id="tableScroll" class="table-container">
            <table id="mainTable">
                <colgroup id="tableColGroup"></colgroup>
                <thead><tr id="headerRow"></tr></thead>
                <tbody id="travelerTableBody"></tbody>
            </table>
        </div>
    </main>

    <div id="loginModal" class="fixed inset-0 z-[110] hidden flex items-center justify-center bg-black/90 backdrop-blur-sm p-4">
        <div class="bg-[#212427] p-10 rounded-[2rem] w-full max-w-sm text-center border border-white/10 shadow-2xl">
            <div class="w-16 h-16 bg-cyan-500/10 rounded-3xl flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-key text-cyan-500 text-xl"></i>
            </div>
            <h2 class="text-lg font-black text-white mb-2 uppercase tracking-widest">Admin Access</h2>
            <p class="text-xs text-slate-500 mb-8">보안 키를 입력하여 관리 모드를 활성화하세요.</p>
            <input type="password" id="loginPassword" placeholder="PASSWORD" class="w-full bg-black/20 border border-white/5 rounded-2xl py-4 text-center outline-none mb-6 text-white focus:border-cyan-500 transition-all">
            <button id="doLogin" class="w-full py-4 bg-cyan-600 text-white font-black rounded-2xl text-sm shadow-xl shadow-cyan-500/20">VERIFY IDENTITY</button>
            <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="mt-6 text-xs text-slate-500 font-bold hover:text-white">CLOSE</button>
        </div>
    </div>

    <div id="deleteConfirmModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-black/90 p-4">
        <div class="bg-[#212427] p-10 rounded-[2rem] w-full max-w-sm text-center border border-red-500/20 shadow-2xl">
            <i class="fa-solid fa-circle-exclamation text-red-500 text-3xl mb-4"></i>
            <h2 class="text-lg font-black text-white mb-2">데이터 삭제</h2>
            <p class="text-xs text-slate-500 mb-8">해당 캐릭터 정보를 아카이브에서 영구적으로 삭제할까요?</p>
            <div class="flex gap-3">
                <button id="cancelDeleteBtn" class="flex-1 py-4 bg-white/5 text-slate-400 font-bold rounded-2xl text-xs">CANCEL</button>
                <button id="confirmDeleteBtn" class="flex-1 py-4 bg-red-600 text-white font-black rounded-2xl text-xs">DELETE</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjbApqAPhrZXcnR2P_xd-nvrZOvZp67CI",
            authDomain: "octopath-85851.firebaseapp.com",
            projectId: "octopath-85851",
            storageBucket: "octopath-85851.firebasestorage.app",
            messagingSenderId: "744016190979",
            appId: "1:744016190979:web:fbc5badeda2e24f5f47836"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'silver-eagle-archive';
        const ADMIN_EMAIL = "tjsgoehd@gmail.com";

        const travelerTableBody = document.getElementById('travelerTableBody');
        const adminBtn = document.getElementById('adminBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const addCharBtn = document.getElementById('addCharBtn');
        const loadingOverlay = document.getElementById('loading');
        const charSearch = document.getElementById('charSearch');
        const searchFieldFilter = document.getElementById('searchFieldFilter');
        const loginPasswordInput = document.getElementById('loginPassword');
        const doLoginBtn = document.getElementById('doLogin');
        const deleteConfirmModal = document.getElementById('deleteConfirmModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
        const headerRow = document.getElementById('headerRow');
        const tableColGroup = document.getElementById('tableColGroup');
        const themeCheckbox = document.getElementById('themeCheckbox');

        let currentUser = null;
        let activeTab = '5star';
        let rawData = [];
        let unsubscribeCurrent = null;
        let deleteIdPending = null;

        const COLLECTION_MAP = { '5star': 'travelers', 'lowstar': 'travelers_lowstar', 'beast': 'travelers_beast' };

        themeCheckbox.onchange = () => {
            const isDark = themeCheckbox.checked;
            document.body.classList.toggle('light-mode', !isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            setTimeout(updateStickyPositions, 50);
            renderTable();
        };

        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'light') {
            document.body.classList.add('light-mode');
            themeCheckbox.checked = false;
        } else {
            document.body.classList.remove('light-mode');
            themeCheckbox.checked = true;
        }

        function updateStickyPositions() {
            const isAdmin = currentUser && !currentUser.isAnonymous;
            const dragH = document.getElementById('dragHeader');
            const jobH = document.getElementById('th-job');
            const typeH = document.getElementById('th-type');
            const nameH = document.getElementById('th-name');
            if (!jobH || !typeH || !nameH) return;
            
            let currentLeft = 0;
            if (isAdmin && dragH) { 
                dragH.style.left = currentLeft + 'px'; 
                currentLeft += dragH.offsetWidth; 
            }
            
            jobH.style.left = currentLeft + 'px';
            document.querySelectorAll('.sticky-col-job').forEach(td => td.style.left = currentLeft + 'px');
            currentLeft += jobH.offsetWidth;
            
            typeH.style.left = currentLeft + 'px';
            document.querySelectorAll('.sticky-col-type').forEach(td => td.style.left = currentLeft + 'px');
            currentLeft += typeH.offsetWidth;
            
            nameH.style.left = currentLeft + 'px';
            document.querySelectorAll('.sticky-col-name').forEach(td => td.style.left = currentLeft + 'px');
        }

        window.deleteRow = (id) => { deleteIdPending = id; deleteConfirmModal.classList.remove('hidden'); };
        confirmDeleteBtn.onclick = async () => {
            if (deleteIdPending) {
                try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], deleteIdPending)); deleteIdPending = null; deleteConfirmModal.classList.add('hidden'); } 
                catch (e) { console.error(e); }
            }
        };
        cancelDeleteBtn.onclick = () => { deleteIdPending = null; deleteConfirmModal.classList.add('hidden'); };

        window.switchTab = (tab) => {
            activeTab = tab;
            if (charSearch) charSearch.value = '';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${tab}`));
            renderHeader();
            loadTable();
        };

        function renderHeader() {
            const isAdmin = currentUser && !currentUser.isAnonymous;
            let hHtml = ''; let cHtml = '';
            
            if (isAdmin) { 
                hHtml += `<th id="dragHeader" class="sticky-col-drag" style="width: 44px;">↕</th>`; 
                cHtml += `<col style="width: 44px;">`; 
            }
            
            const widthClass = activeTab === 'beast' ? 'width: auto; min-width: 80px;' : 'width: 50px;';
            const typeWidthClass = activeTab === 'beast' ? 'width: 80px;' : 'width: 60px;';
            const nameWidthClass = activeTab === 'beast' ? 'width: auto; min-width: 120px;' : 'width: 80px;';

            hHtml += `<th id="th-job" class="sticky-col-job" style="${widthClass}">직업</th>
                      <th id="th-type" class="sticky-col-type" style="${typeWidthClass}">캐릭터</th>
                      <th id="th-name" class="sticky-col-name" style="${nameWidthClass}">이름</th>`;
            
            cHtml += `<col style="${widthClass}">
                      <col style="${typeWidthClass}">
                      <col style="${nameWidthClass}">`;
            
            if (activeTab === 'beast') {
                hHtml += '<th>BP소모</th><th>준비/재사용</th><th>스킬명</th><th>스킬내용</th><th>습득방법</th>';
                cHtml += '<col style="width: auto; min-width: 80px;"><col style="width: auto; min-width: 120px;"><col style="width: auto; min-width: 150px;"><col style="width: auto; min-width: 350px;"><col style="width: auto; min-width: 250px;">';
            } else {
                hHtml += '<th>성장</th><th>등화</th><th>등화(배/서)</th><th>등화(스탯)</th><th>LV</th><th>천부</th><th>필살기</th><th>각성</th><th>오의</th><th>등불</th><th>악세명</th><th>악세(스탯)</th><th>악세(효과)</th><th>서포트</th><th>필살기 정보</th><th>EX 어빌</th>';
                cHtml += '<col style="width: 70px;"><col style="width: 50px;"><col style="width: 90px;"><col style="width: 70px;"><col style="width: 50px;"><col style="width: 50px;"><col style="width: 60px;"><col style="width: 45px;"><col style="width: 45px;"><col style="width: 60px;"><col style="width: 140px;"><col style="width: 180px;"><col style="width: auto; min-width: 380px;"><col style="width: auto; min-width: 450px;"><col style="width: auto; min-width: 380px;"><col style="width: auto; min-width: 380px;">';
            }
            
            if (isAdmin) { hHtml += '<th class="bg-red-900/10 text-red-500" style="width: 50px;">삭제</th>'; cHtml += '<col style="width: 50px;">'; }
            headerRow.innerHTML = hHtml;
            tableColGroup.innerHTML = cHtml;
        }

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const isAdmin = user && !user.isAnonymous;
            adminBtn.classList.toggle('hidden', isAdmin);
            logoutBtn.classList.toggle('hidden', !isAdmin);
            addCharBtn.classList.toggle('hidden', !isAdmin);
            if (!user) await signInAnonymously(auth);
            renderHeader();
            loadTable();
            updateAllCounts();
            loadingOverlay.style.display = 'none';
        });

        function updateAllCounts() {
            ['5star', 'lowstar', 'beast'].forEach(t => {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[t]), (snap) => {
                    let gifts = 0; snap.forEach(d => { if (d.data().gift?.trim()) gifts++; });
                    const btn = document.getElementById(`tab-${t}`);
                    if (btn) btn.innerText = `${t === '5star' ? '5성' : (t === 'lowstar' ? '4성/3성' : '지염수')} (${gifts}/${snap.size})`;
                }, (err) => console.error(err));
            });
        }

        function loadTable() {
            if (unsubscribeCurrent) unsubscribeCurrent();
            unsubscribeCurrent = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab]), (snap) => {
                rawData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                rawData.sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));
                renderTable();
            }, (err) => console.error(err));
        }

        function renderTable() {
            const searchTerm = (charSearch.value || "").toLowerCase().trim();
            const filterField = searchFieldFilter.value;
            travelerTableBody.innerHTML = '';
            rawData.filter(i => {
                if (!searchTerm) return true;
                if (filterField === 'all') return Object.values(i).join(' ').toLowerCase().includes(searchTerm);
                return (i[filterField] || '').toString().toLowerCase().includes(searchTerm);
            }).forEach(i => renderRow(i));
            setTimeout(updateStickyPositions, 50);
        }

        charSearch.oninput = renderTable;
        searchFieldFilter.onchange = renderTable;

        function renderRow(data) {
            const isAdmin = currentUser && !currentUser.isAnonymous;
            const tr = document.createElement('tr');
            tr.setAttribute('data-id', data.id);
            
            if (isAdmin) {
                const dTd = document.createElement('td');
                dTd.className = "drag-handle-cell sticky-col-drag";
                dTd.innerHTML = '<div class="drag-handle-inner text-slate-600"><i class="fa-solid fa-grip-vertical"></i></div>';
                tr.appendChild(dTd);
            }

            let fields = (activeTab === 'beast') ? ['job', 'type', 'name', 'extra2', 'accessory', 'basestat', 'extra3', 'extra4'] 
                        : ['job', 'type', 'name', 'status', 'light', 'support', 'reinforce', 'level', 'gift', 'skill', 'awake', 'ultimate', 'crystal', 'accessory', 'basestat', 'extra1', 'extra2', 'extra3', 'extra4'];
            
            fields.forEach(field => {
                const td = document.createElement('td');
                if (field === 'job') td.classList.add('sticky-col-job');
                if (field === 'type') td.classList.add('sticky-col-type');
                if (field === 'name') td.classList.add('sticky-col-name');

                if (isAdmin) {
                    if ((field === 'type' || field === 'gift') || (field === 'job' && activeTab !== 'beast')) {
                        const w = document.createElement('div'); w.className = "image-cell-wrapper";
                        if (data[field]) {
                            const isType = field === 'type';
                            const imgClass = isType ? "preview-img-large" : "preview-img";
                            const img = document.createElement('img'); img.src = data[field]; img.className = imgClass;
                            img.onclick = () => updateCell(data.id, field, '');
                            w.appendChild(img);
                        } else { w.innerHTML = '<i class="fa-solid fa-image opacity-10 text-[10px]"></i>'; }
                        w.onpaste = (e) => handlePaste(e, (res) => updateCell(data.id, field, res));
                        td.appendChild(w);
                    } else if (['extra1', 'extra2', 'extra3', 'extra4', 'accessory', 'basestat'].includes(field)) {
                        const ta = document.createElement('textarea'); 
                        ta.className = "cell-textarea"; 
                        ta.value = data[field] || '';
                        
                        ta.addEventListener('input', () => {
                            ta.style.height = 'auto';
                            ta.style.height = ta.scrollHeight + 'px';
                        });
                        
                        setTimeout(() => {
                            ta.style.height = 'auto';
                            ta.style.height = ta.scrollHeight + 'px';
                        }, 0);

                        // 정렬 설정
                        if (['extra1', 'extra2', 'extra3', 'extra4'].includes(field)) {
                            ta.style.textAlign = 'left';
                            ta.style.justifyContent = 'start';
                        } else {
                            ta.style.textAlign = 'center';
                            ta.style.justifyContent = 'center';
                        }
                        
                        ta.onblur = () => { if (ta.value !== (data[field] || '')) updateCell(data.id, field, ta.value); };
                        td.appendChild(ta);
                    } else if (field === 'support') {
                        const c = document.createElement('div'); c.className = "flex gap-2 justify-center items-center h-full px-5";
                        const cur = Array.isArray(data[field]) ? data[field] : [];
                        [1, 2].forEach(i => {
                            const rb = document.createElement('input'); rb.type = "checkbox"; rb.className = "round-radio w-4 h-4"; rb.checked = cur.includes(i);
                            rb.onchange = () => updateCell(data.id, field, rb.checked ? [...cur, i] : cur.filter(v => v !== i));
                            c.appendChild(rb);
                        });
                        td.appendChild(c);
                    } else if (['awake', 'ultimate'].includes(field)) {
                        const c = document.createElement('div'); c.className = "flex justify-center items-center h-full min-h-[56px]";
                        const cb = document.createElement('input'); cb.type = "checkbox"; cb.className = "simple-checkbox w-4 h-4"; cb.checked = !!data[field];
                        cb.onchange = () => updateCell(data.id, field, cb.checked);
                        c.appendChild(cb);
                        td.appendChild(c);
                    } else {
                        const inp = document.createElement('input'); inp.className = "cell-input"; inp.value = data[field] || '';
                        if (field === 'status') { inp.style.color = "var(--status-color)"; inp.style.fontWeight = "900"; }
                        if (field === 'light') { inp.style.color = "var(--light-col-color)"; inp.style.fontWeight = "700"; }
                        inp.onblur = () => { if (inp.value !== (data[field] || '')) updateCell(data.id, field, inp.value); };
                        td.appendChild(inp);
                    }
                } else {
                    if ((field === 'type' || field === 'gift') || (field === 'job' && activeTab !== 'beast')) {
                        const isType = field === 'type';
                        const imgClass = isType ? "preview-img-large" : "preview-img";
                        td.innerHTML = data[field] ? `<div class="image-cell-wrapper"><img src="${data[field]}" class="${imgClass}"></div>` : '-';
                    } else if (field === 'support') {
                        const cur = Array.isArray(data[field]) ? data[field] : [];
                        td.innerHTML = `<div class="flex gap-1 justify-center items-center h-full px-5 min-h-[56px]"><span class="badge-box ${cur.includes(1) ? 'active' : ''}">배</span><span class="badge-box ${cur.includes(2) ? 'active' : ''}">서</span></div>`;
                    } else if (['awake', 'ultimate'].includes(field)) {
                        td.innerHTML = data[field] ? '<div class="px-5 h-full min-h-[56px] flex items-center justify-center"><div class="check-circle-icon"><i class="fa-solid fa-check"></i></div></div>' : '<div class="px-5 h-full min-h-[56px] flex items-center justify-center"><span class="opacity-30 text-[10px]">-</span></div>';
                    } else {
                        const s = document.createElement('span'); 
                        const isLeft = ['extra1', 'extra2', 'extra3', 'extra4'].includes(field);
                        s.className = isLeft ? "display-left" : "display-center";
                        if (field === 'status') s.style.color = "var(--status-color)";
                        if (field === 'light') s.style.color = "var(--light-col-color)";
                        if (field === 'basestat' && data[field]) {
                            s.innerHTML = data[field].toString().replace(/-\d+/g, (m) => `<span class="negative-value">${m}</span>`);
                        } else { s.innerText = data[field] || '-'; }
                        td.appendChild(s);
                    }
                }
                tr.appendChild(td);
            });

            if (isAdmin) {
                const delTd = document.createElement('td');
                delTd.innerHTML = `<div class="text-slate-700 hover:text-red-500 cursor-pointer transition-colors px-5 h-full flex items-center justify-center min-h-[56px]" onclick="window.deleteRow('${data.id}')"><i class="fa-solid fa-trash-can"></i></div>`;
                tr.appendChild(delTd);
            }
            travelerTableBody.appendChild(tr);
        }

        async function updateCell(id, f, v) { try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], id), { [f]: v }); } catch(e) { console.error(e); } }

        function handlePaste(e, cb) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) {
                if (item.type.indexOf("image") !== -1) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image(); img.src = ev.target.result;
                        img.onload = () => {
                            const cv = document.createElement('canvas'); const maxW = 100; const sc = maxW / img.width;
                            cv.width = maxW; cv.height = img.height * sc;
                            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                            cb(cv.toDataURL('image/webp', 0.8));
                        };
                    };
                    reader.readAsDataURL(item.getAsFile());
                }
            }
        }

        addCharBtn.onclick = async () => {
            const col = collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab]);
            const snap = await getDocs(col);
            let maxO = snap.docs.reduce((max, d) => Math.max(max, d.data().order ?? -1), -1);
            let newObj = { name: '새 데이터', order: maxO + 1, job: '', type: '', accessory: '', basestat: '', extra1: '', extra2: '', extra3: '' };
            if (activeTab !== 'beast') Object.assign(newObj, { status: activeTab === '5star' ? '5성' : '4성', light: '', level: '', skill: '', crystal: '', support: [] });
            await addDoc(col, newObj);
        };

        const executeLogin = async () => { try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, loginPasswordInput.value); document.getElementById('loginModal').classList.add('hidden'); } catch(e) { alert('인증 실패'); } };
        adminBtn.onclick = () => { document.getElementById('loginModal').classList.remove('hidden'); loginPasswordInput.focus(); };
        doLoginBtn.onclick = executeLogin;
        loginPasswordInput.onkeydown = (e) => { if (e.key === 'Enter') executeLogin(); };
        logoutBtn.onclick = async () => { await signOut(auth); location.reload(); };

        Sortable.create(travelerTableBody, {
            animation: 150, handle: '.drag-handle-cell',
            onEnd: async () => {
                const batch = writeBatch(db);
                Array.from(travelerTableBody.querySelectorAll('tr')).forEach((row, idx) => { batch.update(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], row.getAttribute('data-id')), { order: idx }); });
                await batch.commit();
            }
        });
        window.addEventListener('resize', () => { renderHeader(); updateStickyPositions(); });
    </script>
</body>
</html>
