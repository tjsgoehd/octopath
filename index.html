<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>은빛독수리 캐릭보유 아카이브</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap');
        
        :root { 
            --bg-dark: #0d0d0c; 
            --card-bg: #1a1a18; 
            --accent: #d97706; 
            --status-color: #ffcc00; 
            --highlight: #99ffff;
            --check-accent: #99ffff; 
            --box-accent: #FF9933;   
        }
        
        body { 
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Apple SD Gothic Neo', 'Malgun Gothic'; 
            background-color: var(--bg-dark); 
            color: #e2e2d5; 
            margin: 0; 
            overflow-x: hidden; 
        }
        
        header { background: #141412; border-bottom: 1px solid rgba(217, 119, 6, 0.2); }
        
        .tab-btn {
            padding: 12px 24px;
            font-size: 13px;
            font-weight: 900;
            color: #666;
            border-bottom: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
        }
        .tab-btn.active {
            color: var(--status-color);
            border-bottom-color: var(--status-color);
            background: rgba(255, 204, 0, 0.05);
        }

        .table-container { 
            background: #141412; 
            border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.05); 
            overflow-x: auto;
            position: relative;
        }

        .table-container::-webkit-scrollbar { height: 10px; width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #000000; border-radius: 10px; }
        .table-container::-webkit-scrollbar-thumb { background: #333330; border-radius: 10px; border: 2px solid #000000; }
        .table-container::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        table { width: max-content; min-width: 100%; border-spacing: 0; border-collapse: separate; table-layout: fixed; }

        th { 
            background: #2d2d26 !important; 
            color: #a1a18b !important; 
            font-size: 11px; 
            padding: 12px 15px; 
            border-right: 1px solid rgba(255,255,255,0.05); 
            position: sticky; top: 0; z-index: 20; 
            white-space: nowrap; text-align: center;
        }

        td { 
            font-size: 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.03); 
            border-right: 1px solid rgba(255,255,255,0.02); 
            padding: 0 !important; 
            height: 54px; 
            text-align: center; 
            vertical-align: middle;
            background: #141412;
            box-sizing: border-box;
            overflow: hidden;
        }

        .sticky-col-drag { position: sticky; left: 0; z-index: 30 !important; width: 44px; }
        .sticky-col-job { position: sticky; z-index: 25; width: 80px; }
        .sticky-col-type { position: sticky; z-index: 25; width: 80px; }
        .sticky-col-name { position: sticky; z-index: 25; width: 120px; }

        thead th.sticky-col-job, thead th.sticky-col-type, thead th.sticky-col-name, thead th.sticky-col-drag { z-index: 40 !important; }
        .sticky-shadow { box-shadow: 4px 0 8px -4px rgba(0,0,0,0.5); }

        .admin-textarea-wrapper { 
            display: grid;
            width: 100%;
            min-height: 54px;
            align-items: center;
        }
        
        .cell-textarea { 
            grid-area: 1 / 1 / 2 / 2;
            width: 100% !important; 
            min-height: 54px !important;
            background: transparent !important; 
            border: none !important; 
            color: inherit; 
            text-align: left; 
            outline: none !important; 
            padding: 12px 15px !important; 
            margin: 0 !important; 
            resize: none; 
            overflow: hidden; 
            line-height: 1.5; 
            white-space: pre-wrap; 
            box-sizing: border-box !important;
            field-sizing: content; 
        }

        .cell-input { 
            background: transparent !important; 
            border: 0 !important; 
            color: inherit; 
            text-align: center; 
            outline: none !important; 
            padding: 0 10px !important; 
            width: 100% !important; 
            height: 54px !important;
            box-sizing: border-box !important;
        }

        .drag-handle-cell { cursor: grab; background: #1a1a18; }
        .drag-handle-inner { display: flex; align-items: center; justify-content: center; opacity: 0.3; transition: 0.2s; height: 100%; min-height: 54px; }
        .drag-handle-cell:hover .drag-handle-inner { background: rgba(255,255,255,0.07); opacity: 1; }

        .display-multiline { display: flex; align-items: center; padding: 12px 15px !important; white-space: pre-wrap; line-height: 1.5; text-align: left; word-break: keep-all; min-height: 54px; box-sizing: border-box; }
        .display-center { display: flex; align-items: center; justify-content: center; padding: 12px 15px !important; white-space: pre-wrap; line-height: 1.5; text-align: center; word-break: keep-all; min-height: 54px; box-sizing: border-box; }

        .image-cell-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; cursor: pointer; padding: 0 10px; box-sizing: border-box; }
        .preview-img { max-height: 40px; max-width: 100%; object-fit: contain; }

        .badge-box {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 900;
            background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.2);     
        }
        .badge-box.active { background: var(--highlight) !important; color: #000 !important; }

        .simple-checkbox, .round-radio { width: 16px; height: 16px; cursor: pointer; }
        .simple-checkbox { accent-color: var(--box-accent); }
        .round-radio { accent-color: var(--check-accent); }
        
        .loading-overlay { background: rgba(0,0,0,0.9); display: flex; position: fixed; inset: 0; z-index: 9999; align-items: center; justify-content: center; }

        .filter-select {
            background: #1a1a18; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #a1a18b; font-size: 11px; font-weight: 700; 
            padding: 6px 10px; outline: none; cursor: pointer;
        }

        .delete-btn-wrapper { display: flex; align-items: center; justify-content: center; min-height: 54px; width: 60px; }
        .delete-btn { color: #444; transition: all 0.2s; padding: 10px; cursor: pointer; }
        .delete-btn:hover { color: #ef4444; transform: scale(1.1); }
    </style>
</head>
<body class="min-h-screen pb-12">

    <div id="loading" class="loading-overlay">
        <div class="flex flex-col items-center gap-4">
            <div class="w-12 h-12 border-4 border-amber-500/20 border-t-amber-500 rounded-full animate-spin"></div>
            <p class="text-[11px] font-black text-amber-500 uppercase tracking-widest">Loading Archive...</p>
        </div>
    </div>

    <header class="sticky top-0 z-50 backdrop-blur-sm">
        <div class="px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-amber-900/20 rounded-lg border border-amber-600/30"><i class="fa-solid fa-feather-pointed text-amber-500 text-xl"></i></div>
                <div>
                    <h1 class="text-lg font-black tracking-tight text-amber-50 italic uppercase">은빛독수리 아카이브</h1>
                    <p class="text-[9px] text-amber-600 font-bold uppercase tracking-[0.3em]">SILVER EAGLE ARCHIVE</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button id="addCharBtn" class="hidden flex items-center gap-2 px-4 py-2 bg-amber-600 text-black rounded-lg text-xs font-black hover:bg-amber-500 transition-all shadow-lg">
                    <i class="fa-solid fa-plus"></i> 캐릭터 추가
                </button>
                <div id="userInfo" class="hidden text-[10px] text-zinc-500 font-mono border-l border-white/10 pl-4 h-6 flex items-center"></div>
                <button id="adminBtn" class="px-4 py-2 rounded-lg text-xs font-bold border border-amber-500/50 text-amber-500">ADMIN LOGIN</button>
                <button id="logoutBtn" class="hidden px-4 py-2 rounded-lg text-xs font-bold border border-red-500/50 text-red-500">로그아웃</button>
            </div>
        </div>
        
        <div class="flex items-center justify-between border-t border-white/5 px-4 bg-[#141412]/80">
            <div class="flex">
                <button id="tab-5star" class="tab-btn active" onclick="window.switchTab('5star')">5성 (...)</button>
                <button id="tab-lowstar" class="tab-btn" onclick="window.switchTab('lowstar')">4성/3성 (...)</button>
            </div>
            <div id="userTools" class="flex items-center gap-2 py-2">
                <select id="searchFieldFilter" class="filter-select">
                    <option value="all">전체</option>
                    <option value="basestat">악세(스탯)</option>
                    <option value="extra1">악세(효과)</option>
                    <option value="extra2">서포트</option>
                    <option value="extra3">필살기</option>
                    <option value="extra4">EX 어빌</option>
                </select>
                <input type="text" id="charSearch" placeholder="검색어를 입력하세요.." class="bg-white/5 border border-white/10 rounded-full px-4 py-1.5 text-[11px] text-white outline-none focus:border-amber-500/50 w-[220px]">
            </div>
        </div>
    </header>

    <main class="w-full px-4 py-6">
        <div class="table-container shadow-2xl">
            <table id="mainTable">
                <colgroup>
                    <col id="col-drag" class="hidden" style="width: 44px;">
                    <col style="width: 80px;">
                    <col style="width: 80px;">
                    <col style="width: 120px;">
                    <col style="width: 100px;">
                    <col style="width: 70px;">
                    <col style="width: 120px;">
                    <col style="width: 90px;">
                    <col style="width: 70px;">
                    <col style="width: 70px;">
                    <col style="width: 80px;">
                    <col style="width: 60px;">
                    <col style="width: 60px;">
                    <col style="width: 80px;">
                    <col style="width: 130px;">
                    <col style="width: 180px;">
                    <col style="width: 250px;">
                    <col style="width: 580px;">
                    <col style="width: 470px;">
                    <col style="width: 470px;">
                    <col id="col-admin" class="hidden" style="width: 60px;">
                </colgroup>
                <thead>
                    <tr id="headerRow">
                        <th id="dragHeader" class="hidden sticky-col-drag">↕</th>
                        <th id="th-job" class="sticky-col-job">직업</th>
                        <th id="th-type" class="sticky-col-type">캐릭터</th>
                        <th id="th-name" class="sticky-col-name sticky-shadow">이름</th>
                        <th>성장상태</th><th>등화</th><th>등화(배/서)</th><th>등화(스탯)</th><th>레벨</th><th>천부</th><th>필살기</th><th>각성</th><th>오의</th><th>등불</th><th>악세명</th><th>악세(스탯)</th>
                        <th>악세(효과)</th><th>서포트 어빌</th><th>필살기 정보</th><th>EX 어빌</th> 
                        <th id="adminHeader" class="hidden bg-red-900/20 text-red-500">기능</th>
                    </tr>
                </thead>
                <tbody id="travelerTableBody" class="divide-y divide-white/5"></tbody>
            </table>
        </div>
    </main>

    <div id="loginModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-black/85 backdrop-blur-md p-6">
        <div class="bg-[#1a1a18] border border-amber-900/40 p-8 rounded-[2.5rem] w-full max-w-md text-center">
            <h2 class="text-xl font-black text-amber-500 mb-10 italic uppercase">Admin Verify</h2>
            <input type="password" id="loginPassword" placeholder="••••••" class="w-full bg-black/40 border border-white/5 rounded-2xl py-4 text-center tracking-[0.5em] outline-none focus:border-amber-500/40 text-white mb-6">
            <button id="doLogin" class="w-full py-4 bg-amber-600 text-black font-black uppercase rounded-2xl">인증 완료</button>
            <button onclick="document.getElementById('loginModal').classList.add('hidden')" class="mt-6 text-[10px] text-zinc-600 font-bold uppercase">취소</button>
        </div>
    </div>

    <div id="deleteConfirmModal" class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-black/90 backdrop-blur-sm p-6">
        <div class="bg-[#1a1a18] border border-red-900/40 p-8 rounded-[2rem] w-full max-w-sm text-center">
            <div class="w-16 h-16 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-triangle-exclamation text-red-500 text-2xl"></i>
            </div>
            <h2 class="text-lg font-black text-white mb-2 italic">정말 삭제하시겠습니까?</h2>
            <p class="text-zinc-500 text-xs mb-10 leading-relaxed">이 작업은 되돌릴 수 없으며,<br>모든 정보가 영구 삭제됩니다.</p>
            <div class="flex gap-3">
                <button id="cancelDeleteBtn" class="flex-1 py-4 bg-zinc-800 text-zinc-400 font-bold rounded-xl text-xs">취소</button>
                <button id="confirmDeleteBtn" class="flex-1 py-4 bg-red-600 text-white font-black rounded-xl text-xs shadow-lg shadow-red-900/20">삭제 실행</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAjbApqAPhrZXcnR2P_xd-nvrZOvZp67CI",
            authDomain: "octopath-85851.firebaseapp.com",
            projectId: "octopath-85851",
            storageBucket: "octopath-85851.firebasestorage.app",
            messagingSenderId: "744016190979",
            appId: "1:744016190979:web:fbc5badeda2e24f5f47836"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'silver-eagle-archive';
        const ADMIN_EMAIL = "tjsgoehd@gmail.com";

        const travelerTableBody = document.getElementById('travelerTableBody');
        const adminBtn = document.getElementById('adminBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const adminHeader = document.getElementById('adminHeader');
        const dragHeader = document.getElementById('dragHeader');
        const addCharBtn = document.getElementById('addCharBtn');
        const loadingOverlay = document.getElementById('loading');
        const charSearch = document.getElementById('charSearch');
        const searchFieldFilter = document.getElementById('searchFieldFilter');
        const userTools = document.getElementById('userTools');
        const userInfo = document.getElementById('userInfo');
        const loginPasswordInput = document.getElementById('loginPassword');
        const doLoginBtn = document.getElementById('doLogin');
        const deleteConfirmModal = document.getElementById('deleteConfirmModal');
        const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');
        const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');

        let currentUser = null;
        let activeTab = '5star';
        let rawData = [];
        let unsubscribeCurrent = null;
        let deleteIdPending = null;

        const COLLECTION_MAP = { '5star': 'travelers', 'lowstar': 'travelers_lowstar' };

        function updateStickyPositions() {
            const isAdmin = currentUser && !currentUser.isAnonymous;
            const dragH = document.getElementById('dragHeader');
            const jobH = document.getElementById('th-job');
            const typeH = document.getElementById('th-type');
            const nameH = document.getElementById('th-name');
            let currentLeft = 0;
            if (isAdmin && !dragH.classList.contains('hidden')) { dragH.style.left = currentLeft + 'px'; currentLeft += dragH.offsetWidth; }
            jobH.style.left = currentLeft + 'px'; currentLeft += jobH.offsetWidth;
            typeH.style.left = currentLeft + 'px'; currentLeft += typeH.offsetWidth;
            nameH.style.left = currentLeft + 'px';
        }

        window.deleteRow = (id) => { deleteIdPending = id; deleteConfirmModal.classList.remove('hidden'); };
        confirmDeleteBtn.onclick = async () => {
            if (deleteIdPending) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], deleteIdPending));
                    deleteIdPending = null;
                    deleteConfirmModal.classList.add('hidden');
                } catch (e) { console.error(e); }
            }
        };
        cancelDeleteBtn.onclick = () => { deleteIdPending = null; deleteConfirmModal.classList.add('hidden'); };

        window.switchTab = (tab) => {
            activeTab = tab;
            if (searchFieldFilter) searchFieldFilter.value = 'all';
            if (charSearch) charSearch.value = '';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.id === `tab-${tab}`));
            loadTable();
        };

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const isAdmin = user && !user.isAnonymous;
            adminBtn.classList.toggle('hidden', isAdmin);
            logoutBtn.classList.toggle('hidden', !isAdmin);
            adminHeader.classList.toggle('hidden', !isAdmin);
            dragHeader.classList.toggle('hidden', !isAdmin);
            addCharBtn.classList.toggle('hidden', !isAdmin);
            document.getElementById('col-drag').classList.toggle('hidden', !isAdmin);
            document.getElementById('col-admin').classList.toggle('hidden', !isAdmin);
            userTools.classList.toggle('hidden', isAdmin); 
            if (isAdmin) {
                userInfo.classList.remove('hidden');
                userInfo.innerHTML = `<span class="bg-amber-500/10 text-amber-500 px-2 py-0.5 rounded text-[9px] font-black mr-2">ADMIN</span> ${user.email}`;
            } else {
                userInfo.classList.add('hidden');
                if (!user) await signInAnonymously(auth);
            }
            loadTable();
            updateAllCounts();
            loadingOverlay.style.display = 'none';
            setTimeout(updateStickyPositions, 100);
        });

        function updateAllCounts() {
            ['5star', 'lowstar'].forEach(t => {
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[t]), (snap) => {
                    let gifts = 0; snap.forEach(d => { if (d.data().gift?.trim()) gifts++; });
                    const btn = document.getElementById(`tab-${t}`);
                    if (btn) btn.innerText = `${t === '5star' ? '5성' : '4성/3성'} (${gifts}명/${snap.size}명)`;
                });
            });
        }

        function loadTable() {
            if (unsubscribeCurrent) unsubscribeCurrent();
            unsubscribeCurrent = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab]), (snap) => {
                rawData = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                rawData.sort((a, b) => (a.order ?? 9999) - (b.order ?? 9999));
                renderTable();
                setTimeout(updateStickyPositions, 100);
            });
        }

        function renderTable() {
            const searchTerm = (charSearch.value || "").toLowerCase().trim();
            const filterField = searchFieldFilter.value;
            travelerTableBody.innerHTML = '';
            rawData.filter(i => {
                if (!searchTerm) return true;
                if (filterField === 'all') return Object.values(i).join(' ').toLowerCase().includes(searchTerm);
                return (i[filterField] || '').toString().toLowerCase().includes(searchTerm);
            }).forEach(i => renderRow(i));
        }

        charSearch.oninput = renderTable;
        searchFieldFilter.onchange = renderTable;

        function renderRow(data) {
            const isAdmin = currentUser && !currentUser.isAnonymous;
            const tr = document.createElement('tr');
            tr.setAttribute('data-id', data.id);
            let currentOffset = 0;

            if (isAdmin) {
                const dTd = document.createElement('td');
                dTd.className = "drag-handle-cell sticky-col-drag";
                dTd.style.left = '0px';
                dTd.innerHTML = '<div class="drag-handle-inner"><i class="fa-solid fa-grip-vertical"></i></div>';
                tr.appendChild(dTd);
                currentOffset += 44; 
            }

            const fields = ['job', 'type', 'name', 'status', 'light', 'support', 'reinforce', 'level', 'gift', 'skill', 'awake', 'ultimate', 'crystal', 'accessory', 'basestat', 'extra1', 'extra2', 'extra3', 'extra4'];
            
            fields.forEach(field => {
                const td = document.createElement('td');
                if (field === 'job') { td.classList.add('sticky-col-job'); td.style.left = currentOffset + 'px'; }
                if (field === 'type') { td.classList.add('sticky-col-type'); td.style.left = (currentOffset + 80) + 'px'; }
                if (field === 'name') { td.classList.add('sticky-col-name', 'sticky-shadow'); td.style.left = (currentOffset + 160) + 'px'; }

                if (isAdmin) {
                    if (['job', 'type', 'gift'].includes(field)) {
                        const w = document.createElement('div'); w.className = "image-cell-wrapper";
                        if (data[field]) {
                            const img = document.createElement('img'); img.src = data[field]; img.className = "preview-img";
                            img.onclick = (e) => { e.stopPropagation(); updateCell(data.id, field, ''); };
                            w.appendChild(img);
                        } else { w.innerHTML = '<i class="fa-solid fa-image opacity-10 text-[10px]"></i>'; }
                        w.onpaste = (e) => handlePaste(e, (res) => updateCell(data.id, field, res));
                        td.appendChild(w);
                    } else if (['extra1', 'extra2', 'extra3', 'extra4'].includes(field)) {
                        const w = document.createElement('div'); w.className = "admin-textarea-wrapper";
                        const ta = document.createElement('textarea'); ta.className = "cell-textarea";
                        ta.value = data[field] || '';
                        ta.onblur = () => { if (ta.value !== (data[field] || '')) updateCell(data.id, field, ta.value); };
                        const syncHeight = () => {
                            if (!CSS.supports('field-sizing', 'content')) {
                                ta.style.height = '54px';
                                ta.style.height = ta.scrollHeight + 'px';
                            }
                        };
                        ta.addEventListener('input', syncHeight);
                        w.appendChild(ta); td.appendChild(w);
                        setTimeout(syncHeight, 0);
                    } else if (field === 'support') {
                        const c = document.createElement('div'); c.className = "flex gap-4 justify-center items-center h-[54px] px-2";
                        const cur = Array.isArray(data[field]) ? data[field] : [];
                        [1, 2].forEach(i => {
                            const rb = document.createElement('input'); rb.type = "checkbox"; rb.className = "round-radio"; rb.checked = cur.includes(i);
                            rb.onchange = () => updateCell(data.id, field, rb.checked ? [...cur, i] : cur.filter(v => v !== i));
                            c.appendChild(rb);
                        });
                        td.appendChild(c);
                    } else if (['awake', 'ultimate'].includes(field)) {
                        const w = document.createElement('div'); w.className = "flex items-center justify-center h-[54px]";
                        const cb = document.createElement('input'); cb.type = "checkbox"; cb.className = "simple-checkbox"; cb.checked = !!data[field];
                        cb.onchange = () => updateCell(data.id, field, cb.checked);
                        w.appendChild(cb); td.appendChild(w);
                    } else {
                        const w = document.createElement('div'); w.className = "flex items-center justify-center";
                        const inp = document.createElement('input'); inp.className = "cell-input";
                        inp.value = data[field] || '';
                        if (field === 'light' || field === 'reinforce') inp.style.color = "#99ffff";
                        else if (field === 'skill') inp.style.color = "#ff9933";
                        else if (field === 'status') { inp.style.color = "#ffcc00"; inp.style.fontWeight = "900"; }
                        inp.onblur = () => { if (inp.value !== (data[field] || '')) updateCell(data.id, field, inp.value); };
                        w.appendChild(inp); td.appendChild(w);
                    }
                } else {
                    if (['job', 'type', 'gift'].includes(field)) {
                        td.innerHTML = data[field] ? `<div class="px-2 h-[54px] flex items-center justify-center"><img src="${data[field]}" class="preview-img"></div>` : '-';
                    } else if (field === 'support') {
                        const cur = Array.isArray(data[field]) ? data[field] : [];
                        td.innerHTML = `<div class="flex gap-1.5 justify-center items-center h-[54px] px-2"><span class="badge-box ${cur.includes(1) ? 'active' : ''}">배틀</span><span class="badge-box ${cur.includes(2) ? 'active' : ''}">서포트</span></div>`;
                    } else if (['awake', 'ultimate'].includes(field)) {
                        td.innerHTML = data[field] ? '<div class="px-2 h-[54px] flex items-center justify-center"><i class="fa-solid fa-check text-[#ff9933]"></i></div>' : '-';
                    } else {
                        const s = document.createElement('span'); 
                        // 정렬 기준 수정
                        const centerFields = ['name', 'status', 'light', 'reinforce', 'level', 'skill', 'crystal'];
                        if (centerFields.includes(field)) {
                            s.className = "display-center";
                        } else {
                            s.className = "display-multiline";
                        }
                        
                        if (field === 'light' || field === 'reinforce') s.style.color = "#99ffff";
                        if (field === 'skill') s.style.color = "#ff9933";
                        if (field === 'status') s.style.color = "#ffcc00";
                        s.innerText = data[field] || '-'; td.appendChild(s);
                    }
                }
                tr.appendChild(td);
            });

            if (isAdmin) {
                const delTd = document.createElement('td');
                delTd.innerHTML = `<div class="delete-btn-wrapper"><div class="delete-btn" onclick="window.deleteRow('${data.id}')"><i class="fa-solid fa-trash-can"></i></div></div>`;
                tr.appendChild(delTd);
            }
            travelerTableBody.appendChild(tr);
        }

        async function updateCell(id, f, v) { 
            try { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], id), { [f]: v }); } 
            catch(e) { console.error(e); }
        }

        function handlePaste(e, cb) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (const item of items) {
                if (item.type.indexOf("image") !== -1) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image(); img.src = ev.target.result;
                        img.onload = () => {
                            const cv = document.createElement('canvas'); const maxW = 120; const sc = maxW / img.width;
                            cv.width = maxW; cv.height = img.height * sc;
                            cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
                            cb(cv.toDataURL('image/webp', 0.8));
                        };
                    };
                    reader.readAsDataURL(item.getAsFile());
                }
            }
        }

        addCharBtn.onclick = async () => {
            const col = collection(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab]);
            const snap = await getDocs(col);
            let maxO = snap.docs.reduce((max, d) => Math.max(max, d.data().order ?? -1), -1);
            await addDoc(col, { 
                name: '새 캐릭터', status: activeTab === '5star' ? '5성' : '4성', order: maxO + 1,
                light: '', reinforce: '', level: '', skill: '', crystal: '', accessory: '', basestat: '', extra1: '', extra2: '', extra3: '', extra4: '', support: []
            });
        };

        const executeLogin = async () => {
            try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, loginPasswordInput.value); document.getElementById('loginModal').classList.add('hidden'); } 
            catch(e) { alert('인증 실패'); }
        };

        adminBtn.onclick = () => { document.getElementById('loginModal').classList.remove('hidden'); loginPasswordInput.focus(); };
        doLoginBtn.onclick = executeLogin;
        
        // 엔터키 로그인 처리
        loginPasswordInput.onkeydown = (e) => {
            if (e.key === 'Enter') executeLogin();
        };

        logoutBtn.onclick = async () => { await signOut(auth); location.reload(); };

        Sortable.create(travelerTableBody, {
            animation: 150, handle: '.drag-handle-cell',
            onEnd: async () => {
                const batch = writeBatch(db);
                Array.from(travelerTableBody.querySelectorAll('tr')).forEach((row, idx) => {
                    batch.update(doc(db, 'artifacts', appId, 'public', 'data', COLLECTION_MAP[activeTab], row.getAttribute('data-id')), { order: idx });
                });
                await batch.commit();
            }
        });
        window.addEventListener('resize', updateStickyPositions);
    </script>
</body>
</html>
