<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옥토패스 트래블러 계정 매물 리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        /* 기본 하이라이트 스타일 */
        .highlight-partitio {
            background-color: #fef08a; /* Yellow-200 */
            color: #854d0e; /* Yellow-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #fde047;
            transition: all 0.2s;
        }

        .highlight-moru {
            background-color: #dcfce7; /* Green-100 */
            color: #166534; /* Green-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #bbf7d0;
            transition: all 0.2s;
        }

        .highlight-priestess {
            background-color: #f3e8ff; /* Purple-100 */
            color: #581c87; /* Purple-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #e9d5ff;
            transition: all 0.2s;
        }

        /* 토글 오프 상태일 때 하이라이트 제거 */
        body.hide-partitio .highlight-partitio,
        body.hide-moru .highlight-moru,
        body.hide-priestess .highlight-priestess {
            background-color: transparent;
            color: inherit;
            font-weight: inherit;
            border-color: transparent;
            padding: 0;
        }

        .account-card:hover {
            transform: translateY(-2px);
            transition: all 0.2s ease;
        }

        .char-tag {
            display: inline-block;
            margin: 2px;
        }

        /* 버튼 활성/비활성 스타일 */
        .btn-toggle {
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .btn-toggle.inactive {
            background-color: #e2e8f0 !important;
            color: #64748b !important;
            border-color: #cbd5e1 !important;
            text-decoration: line-through;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-2">옥토패스 트래블러 계정 리스트</h1>
            <p class="text-slate-500">주요 캐릭터 하이라이트 및 검색 시스템</p>
        </header>

        <!-- Search Bar -->
        <div class="mb-4 sticky top-4 z-20">
            <input type="text" id="searchInput" placeholder="번호, 보석수, 또는 캐릭터 이름으로 검색..." 
                   class="w-full p-4 rounded-xl border-none shadow-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg">
            
            <!-- Toggle Buttons -->
            <div class="flex gap-2 mt-4 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="toggleHighlight('moru', this)" 
                        class="btn-toggle flex-shrink-0 px-4 py-2 rounded-full bg-green-500 text-white font-bold shadow-md hover:bg-green-600">
                    모루룻소EX On
                </button>
                <button onclick="toggleHighlight('partitio', this)" 
                        class="btn-toggle flex-shrink-0 px-4 py-2 rounded-full bg-yellow-500 text-white font-bold shadow-md hover:bg-yellow-600">
                    파르티티오EX On
                </button>
                <button onclick="toggleHighlight('priestess', this)" 
                        class="btn-toggle flex-shrink-0 px-4 py-2 rounded-full bg-purple-500 text-white font-bold shadow-md hover:bg-purple-600">
                    흑무녀 On
                </button>
                <span class="text-xs text-slate-400 flex items-center ml-2">* 버튼을 눌러 강조를 켜고 끕니다.</span>
            </div>
        </div>

        <div id="listContainer">
            <!-- 5만 섹션 -->

                </div>
                <div class="grid gap-3" id="section-5"></div>
            </section>

            </section>
        </div>

        function formatLine(line) {
            const parts = line.split('/');
            const id = parts[0];
            const gems = parts[1];
            const characters = parts.slice(2);

            let charHtml = characters.map(char => {
                if (char.includes("파르티티오EX")) {
                    return `<span class="highlight-partitio">${char}</span>`;
                } else if (char.includes("모루룻소EX")) {
                    return `<span class="highlight-moru">${char}</span>`;
                } else if (char.includes("흑무녀")) {
                    return `<span class="highlight-priestess">${char}</span>`;
                }
                return `<span class="char-tag text-slate-600">${char}</span>`;
            }).join(' / ');

            return `
                <div class="account-card bg-white p-4 rounded-lg shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="flex-shrink-0 bg-slate-100 px-3 py-1 rounded font-bold text-slate-700 w-24 text-center">
                        ${id}
                    </div>
                    <div class="flex-shrink-0 font-extrabold text-orange-600 min-w-[100px]">
                        ${gems}
                    </div>
                    <div class="flex-grow text-sm leading-relaxed">
                        ${charHtml}
                    </div>
                </div>
            `;
        }

        function toggleHighlight(type, btn) {
            const body = document.body;
            const className = `hide-${type}`;
            const isHiding = body.classList.toggle(className);
            
            if (isHiding) {
                btn.classList.add('inactive');
                btn.innerText = btn.innerText.replace('On', 'Off');
            } else {
                btn.classList.remove('inactive');
                btn.innerText = btn.innerText.replace('Off', 'On');
            }
        }

        function renderAll() {
            const sections = {
                "5": document.getElementById('section-5'),
                "8": document.getElementById('section-8'),
                "11": document.getElementById('section-11')
            };

            for (const key in rawData) {
                sections[key].innerHTML = rawData[key].map(line => formatLine(line)).join('');
            }
        }

        // 검색 기능
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.account-card');

            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'flex' : 'none';
            });

            document.querySelectorAll('.price-section').forEach(section => {
                const visibleCards = section.querySelectorAll('.account-card[style="display: flex;"]');
                section.style.display = (visibleCards.length > 0 || term === "") ? 'block' : 'none';
            });
        });

        // 초기 실행
        renderAll();
    </script>
