<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옥토패스 트래블러 계정 매물 리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        /* 기본 하이라이트 스타일 */
        .highlight-partitio {
            background-color: #fef08a; /* Yellow-200 */
            color: #854d0e; /* Yellow-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #fde047;
            transition: all 0.2s;
        }

        .highlight-moru {
            background-color: #dcfce7; /* Green-100 */
            color: #166534; /* Green-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #bbf7d0;
            transition: all 0.2s;
        }

        .highlight-priestess {
            background-color: #f3e8ff; /* Purple-100 */
            color: #581c87; /* Purple-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #e9d5ff;
            transition: all 0.2s;
        }

        .highlight-abite {
            background-color: #dbeafe; /* Blue-100 */
            color: #1e3a8a; /* Blue-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #bfdbfe;
            transition: all 0.2s;
        }

        .highlight-shana {
            background-color: #ffe4e6; /* Rose-100 */
            color: #881337; /* Rose-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #fecdd3;
            transition: all 0.2s;
        }

        /* 토글 오프 상태일 때 하이라이트 제거 */
        body.hide-partitio .highlight-partitio,
        body.hide-moru .highlight-moru,
        body.hide-priestess .highlight-priestess,
        body.hide-abite .highlight-abite,
        body.hide-shana .highlight-shana {
            background-color: transparent;
            color: inherit;
            font-weight: inherit;
            border-color: transparent;
            padding: 0;
        }

        .account-card:hover {
            transform: translateY(-2px);
            transition: all 0.2s ease;
        }

        .char-tag {
            display: inline-block;
            margin: 2px;
        }

        /* 버튼 활성/비활성 스타일 */
        .btn-toggle {
            transition: all 0.2s;
            border: 1px solid transparent;
            white-space: nowrap; /* 텍스트 줄바꿈 방지 */
        }
        .btn-toggle.inactive {
            background-color: #e2e8f0 !important;
            color: #64748b !important;
            border-color: #cbd5e1 !important;
            text-decoration: line-through;
        }

        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">

        <div class="mb-4 sticky top-4 z-20">

                   class="w-full p-4 rounded-xl border-none shadow-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg">
            
            <!-- Toggle Buttons (Fixed for Mobile) -->
            <div class="flex items-center gap-2 mt-4 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="toggleHighlight('moru', this)"

                    모루룻소EX On

                <button onclick="toggleHighlight('partitio', this)"

                    파르티티오EX On

                <button onclick="toggleHighlight('priestess', this)"

                    흑무녀 On

                <button onclick="toggleHighlight('abite', this)"

                <button onclick="toggleHighlight('shana', this)"

            </div>
        </div>

        <div id="listContainer">
            <!-- 5만 섹션 -->

                    </div>

                    </div>
                </div>

            </section>
        </div>
    </div>

        function formatLine(line) {
            const parts = line.split('/');
            if (parts.length < 2) return ""; 
            const id = parts[0];
            const gems = parts[1];
            const characters = parts.slice(2).filter(char => char.trim() !== "");

            let charHtml = characters.map(char => {
                if (char.includes("파르티티오EX")) {
                    return `<span class="highlight-partitio">${char}</span>`;
                } else if (char.includes("모루룻소EX")) {
                    return `<span class="highlight-moru">${char}</span>`;
                } else if (char.includes("흑무녀")) {
                    return `<span class="highlight-priestess">${char}</span>`;
                } else if (char.includes("아뷔테")) {
                    return `<span class="highlight-abite">${char}</span>`;
                } else if (char.includes("샤나")) {
                    return `<span class="highlight-shana">${char}</span>`;
                }
                return `<span class="char-tag text-slate-600">${char}</span>`;
            }).join(' / ');

            return `
                <div class="account-card bg-white p-4 rounded-lg shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="flex-shrink-0 bg-slate-100 px-3 py-1 rounded font-bold text-slate-700 w-24 text-center">
                        ${id}
                    </div>
                    <div class="flex-shrink-0 font-extrabold text-orange-600 min-w-[100px]">
                        ${gems}
                    </div>
                    <div class="flex-grow text-sm leading-relaxed">
                        ${charHtml}
                    </div>
                </div>
            `;
        }

        function toggleHighlight(type, btn) {
            const body = document.body;
            const className = `hide-${type}`;
            const isHiding = body.classList.toggle(className);
            
            if (isHiding) {
                btn.classList.add('inactive');
                btn.innerText = btn.innerText.replace('On', 'Off');
            } else {
                btn.classList.remove('inactive');
                btn.innerText = btn.innerText.replace('Off', 'On');
            }
        }

        function renderAll() {
            const sections = {
                "5": document.getElementById('section-5'),
                "6": document.getElementById('section-6'),
                "7": document.getElementById('section-7')
            };

            for (const key in rawData) {
                if (sections[key]) {
                    sections[key].innerHTML = rawData[key].map(line => formatLine(line)).join('');
                }
            }
        }

        // 검색 기능
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.account-card');

            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'flex' : 'none';
            });

            document.querySelectorAll('.price-section').forEach(section => {
                const visibleCards = section.querySelectorAll('.account-card[style="display: flex;"]');
                section.style.display = (visibleCards.length > 0 || term === "") ? 'block' : 'none';
            });
        });

        // 초기 실행
        renderAll();
    </script>
</body>
</html>
