<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>옥토패스 트래블러 계정 매물 리스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f8fafc;
        }

        /* 기본 하이라이트 스타일 */
        .highlight-partitio {
            background-color: #fef08a; /* Yellow-200 */
            color: #854d0e; /* Yellow-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #fde047;
            transition: all 0.2s;
        }

        .highlight-moru {
            background-color: #dcfce7; /* Green-100 */
            color: #166534; /* Green-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #bbf7d0;
            transition: all 0.2s;
        }

        .highlight-priestess {
            background-color: #f3e8ff; /* Purple-100 */
            color: #581c87; /* Purple-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #e9d5ff;
            transition: all 0.2s;
        }

        .highlight-abite {
            background-color: #dbeafe; /* Blue-100 */
            color: #1e3a8a; /* Blue-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #bfdbfe;
            transition: all 0.2s;
        }

        .highlight-shana {
            background-color: #ffe4e6; /* Rose-100 */
            color: #881337; /* Rose-900 */
            font-weight: bold;
            padding: 2px 4px;
            border-radius: 4px;
            border: 1px solid #fecdd3;
            transition: all 0.2s;
        }

        /* 토글 오프 상태일 때 하이라이트 제거 */
        body.hide-partitio .highlight-partitio,
        body.hide-moru .highlight-moru,
        body.hide-priestess .highlight-priestess,
        body.hide-abite .highlight-abite,
        body.hide-shana .highlight-shana {
            background-color: transparent;
            color: inherit;
            font-weight: inherit;
            border-color: transparent;
            padding: 0;
        }

        .account-card:hover {
            transform: translateY(-2px);
            transition: all 0.2s ease;
        }

        .char-tag {
            display: inline-block;
            margin: 2px;
        }

        /* 버튼 활성/비활성 스타일 */
        .btn-toggle {
            transition: all 0.2s;
            border: 1px solid transparent;
            white-space: nowrap; /* 텍스트 줄바꿈 방지 */
        }
        .btn-toggle.inactive {
            background-color: #e2e8f0 !important;
            color: #64748b !important;
            border-color: #cbd5e1 !important;
            text-decoration: line-through;
        }

        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-slate-800 mb-2">옥토패스 트래블러 계정 리스트</h1>
            <p class="text-slate-500">주요 캐릭터 하이라이트 및 검색 시스템</p>
        </header>

        <!-- Search Bar -->
        <div class="mb-4 sticky top-4 z-20">
            <input type="text" id="searchInput" placeholder="번호, 보석수, 또는 캐릭터 이름으로 검색..." 
                   class="w-full p-4 rounded-xl border-none shadow-xl focus:ring-2 focus:ring-blue-500 outline-none text-lg">
            
            <!-- Toggle Buttons (Fixed for Mobile) -->
            <div class="flex items-center gap-2 mt-4 overflow-x-auto pb-2 no-scrollbar">
                <button onclick="toggleHighlight('moru', this)" 
                        class="btn-toggle flex-shrink-0 px-4 py-2 rounded-full bg-green-500 text-white text-sm md:text-base font-bold shadow-md hover:bg-green-600">
                    모루룻소EX On
                </button>
                <button onclick="toggleHighlight('partitio', this)" 
                        class="btn-toggle flex-shrink-0 px-4 py-2 rounded-full bg-yellow-500 text-white text-sm md:text-base font-bold shadow-md hover:bg-yellow-600">
                    파르티티오EX On
                </button>
                <button onclick="toggleHighlight('priestess', this)" 
                        class="btn-toggle flex-shrink-0 px-4 py-2 rounded-full bg-purple-500 text-white text-sm md:text-base font-bold shadow-md hover:bg-purple-600">
                    흑무녀 On
                </button>
                <button onclick="toggleHighlight('abite', this)" 
                        class="btn-toggle flex-shrink-0 px-4 py-2 rounded-full bg-blue-500 text-white text-sm md:text-base font-bold shadow-md hover:bg-blue-600">
                    아뷔테 On
                </button>
                <button onclick="toggleHighlight('shana', this)" 
                        class="btn-toggle flex-shrink-0 px-4 py-2 rounded-full bg-rose-500 text-white text-sm md:text-base font-bold shadow-md hover:bg-rose-600">
                    샤나 On
                </button>
                <span class="text-[10px] md:text-xs text-slate-400 flex-shrink-0 ml-2">* 터치하여 온/오프</span>
            </div>
        </div>

        <div id="listContainer">
            <!-- 5만 섹션 -->
            <section class="mb-10 price-section" data-price="50000">
                <div class="flex items-center mb-4 border-b-2 border-blue-500 pb-2">
                    <h2 class="text-2xl font-bold text-blue-700">#### 5만 ####</h2>
                </div>
                <div class="grid gap-3" id="section-5"></div>
            </section>

            <!-- 8만 섹션 -->
            <section class="mb-10 price-section" data-price="80000">
                <div class="flex flex-col md:flex-row md:items-end mb-4 border-b-2 border-emerald-500 pb-2 gap-2">
                    <h2 class="text-2xl font-bold text-emerald-700">#### 8만 ####</h2>
                    <span class="text-xs md:text-sm text-rose-600 font-extrabold md:mb-1">※ 카이네, 니어 4각계정 마지막 매물입니다. 더 없습니다.</span>
                </div>
                <div class="grid gap-3" id="section-8"></div>
            </section>
        </div>
    </div>

    <script>
        const rawData = {
            "5": [
                "4-721/보석16000/아뷔테/샤나/미디야/파디스/카이네/니어/티치1/시그나/니콜라/프림EX/바르젤로/린유EX/솔론/사이러스EX/흑무녀/시그나EX/로크",
                "4-407/보석13000/아뷔테/샤나/미디야/파디스/카이네1/니어1/티치/시그나/니콜라/프림EX1/네프티/사이러스EX/흑기사/시그나EX/파르티티오EX/로크",
                "2-512/보석15000/아뷔테/샤나1/미디야/파디스/카이네/니어1/티치/카나리/시그나1/니콜라/프림EX/아일라/에리카1/사이러스EX/흑기사/테레즈EX/리넷EX/티나",
                "1-634/보석16000/아뷔테/샤나/미디야/파디스/카이네/니어/티치/시그나/니콜라/프림EX/린유EX/바르젤로/사이러스EX/흑무녀/시그나EX/에드거",
                "6-931/보석17000/아뷔테/샤나/미디야/파디스/카이네/니어/티치/시그나1/니콜라/프림EX/바르젤로/솔론/한이트EX/비올라EX/흑무녀/테레즈EX/로크/티아",
                "1-305/보석13000/아뷔테/샤나/미디야/파디스/카이네2/니어/티치/시그나1/니콜라/린유/한이트EX/오즈발드/사이러스EX/흑무녀/파르티티오EX/에리카EX/에드거",
                "2-162/보석14000/아뷔테/샤나/미디야/파디스/카이네/니어/티치/시그나/니콜라1/프림EX/리크/한이트EX1/비올라EX/흑무녀/시그나EX/르메르/로크",
                "3-490/보석9000/아뷔테/샤나/미디야/파디스/카이네1/니어/티치/카나리/프림EX/리샤르/네프티/바르젤로/솔론3/한이트EX/비올라EX/흑무녀/파르티티오EX/사잔/소니아/에드거",
                "4-321/보석16000/아뷔테/샤나/미디야/파디스/카이네/니어/티치/시그나/니콜라/프림EX/리크/비올라EX1/흑무녀/테레즈EX/사잔/르메르/에드거",
                "6-259/보석15000/아뷔테1/샤나/미디야/파디스1/카이네/니어1/티치/카나리/니콜라1/프림EX/비올라EX/흑무녀/파르티티오EX/에드거"
            ],
            "8": [
                "4-401/보석16000/아뷔테5/샤나/미디야/파디스//카이네/니어/티치/시그나1/니콜라1/프림EX/사이러스EX/흑무녀/파르티티오EX/린유EX/셀크1/티나",
                "3-408/보석10000/아뷔테/샤나/미디야1/파디스/카이네4/니어/티치/시그나/니콜라3/프림EX/한이트EX/킬른/사이러스EX/흑무녀/테레즈EX/사잔/레비나EX/로크",
                "3-690/보석12000/아뷔테/샤나/미디야/파디스/카이네/니어/티치/니콜라2/프림EX1/테메노스/사이러스EX1/흑무녀/시그나EX4/테레즈EX2/파르티티오EX1/리넷EX/티나"
            ]
        };

        function formatLine(line) {
            const parts = line.split('/');
            if (parts.length < 2) return ""; 
            const id = parts[0];
            const gems = parts[1];
            // 빈 요소(연속된 슬래시로 인한 공백 등)를 필터링합니다.
            const characters = parts.slice(2).filter(char => char.trim() !== "");

            let charHtml = characters.map(char => {
                if (char.includes("파르티티오EX")) {
                    return `<span class="highlight-partitio">${char}</span>`;
                } else if (char.includes("모루룻소EX")) {
                    return `<span class="highlight-moru">${char}</span>`;
                } else if (char.includes("흑무녀")) {
                    return `<span class="highlight-priestess">${char}</span>`;
                } else if (char.includes("아뷔테")) {
                    return `<span class="highlight-abite">${char}</span>`;
                } else if (char.includes("샤나")) {
                    return `<span class="highlight-shana">${char}</span>`;
                }
                return `<span class="char-tag text-slate-600">${char}</span>`;
            }).join(' / ');

            return `
                <div class="account-card bg-white p-4 rounded-lg shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-start md:items-center">
                    <div class="flex-shrink-0 bg-slate-100 px-3 py-1 rounded font-bold text-slate-700 w-24 text-center">
                        ${id}
                    </div>
                    <div class="flex-shrink-0 font-extrabold text-orange-600 min-w-[100px]">
                        ${gems}
                    </div>
                    <div class="flex-grow text-sm leading-relaxed">
                        ${charHtml}
                    </div>
                </div>
            `;
        }

        function toggleHighlight(type, btn) {
            const body = document.body;
            const className = `hide-${type}`;
            const isHiding = body.classList.toggle(className);
            
            if (isHiding) {
                btn.classList.add('inactive');
                btn.innerText = btn.innerText.replace('On', 'Off');
            } else {
                btn.classList.remove('inactive');
                btn.innerText = btn.innerText.replace('Off', 'On');
            }
        }

        function renderAll() {
            const sections = {
                "5": document.getElementById('section-5'),
                "8": document.getElementById('section-8')
            };

            for (const key in rawData) {
                if (sections[key]) {
                    sections[key].innerHTML = rawData[key].map(line => formatLine(line)).join('');
                }
            }
        }

        // 검색 기능
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.account-card');

            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(term) ? 'flex' : 'none';
            });

            document.querySelectorAll('.price-section').forEach(section => {
                const visibleCards = section.querySelectorAll('.account-card[style="display: flex;"]');
                section.style.display = (visibleCards.length > 0 || term === "") ? 'block' : 'none';
            });
        });

        // 초기 실행
        renderAll();
    </script>
</body>
</html>
